[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-trading-simulator"
version = "0.1.0"
description = "An event-driven, multi-strategy adaptive trading simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nexo = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backtest*",
    "core*",
    "execution*",
    "intelligence*",
    "observability*",
    "state*",
    "strategies*",
]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-trading-simulator"
version = "1.0.0"
description = "An event-driven, multi-strategy adaptive trading simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # JWT-ready authentication abstractions. NeXo does not issue tokens; this
    # backs the decode/verify path so protected /api/v1 routes are enforceable
    # the moment an external identity provider is configured.
    "pyjwt>=2.8,<3.0",
    # v2 persistence layer. SQLite is used for local dev/tests (no server
    # required); PostgreSQL (psycopg) is the production target via DATABASE_URL.
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
]
# Test/dev extras. httpx backs Starlette's TestClient for HTTP round-trip
# tests against the dashboard API; install alongside the dashboard extra.
test = [
    "httpx>=0.27,<1.0",
]

[project.scripts]
nexo = "main:main"
nexo-dashboard = "ui.dashboard:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "backtest*",
    "core*",
    "db*",
    "execution*",
    "intelligence*",
    "observability*",
    "state*",
    "strategies*",
    "ui*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
ui = ["static/*"]
